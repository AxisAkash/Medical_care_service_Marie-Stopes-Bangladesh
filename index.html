<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b34" />
    <meta name="description" content="Marie Stopes Bangladesh ERP coordinates reproductive healthcare operations across Bangladesh." />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("msb-theme") || "system";
          var resolved = mode === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/care-icon.svg" />
    <title>Marie Stopes Bangladesh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
